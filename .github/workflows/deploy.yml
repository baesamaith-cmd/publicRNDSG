name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy
          cp index.html deploy/
          cp -r dashboard deploy/

          # Convert JSON to JavaScript (prevent direct URL access)
          echo "const _d=$(cat deploy/dashboard/data/projects.json);function _getData(){return _d;}" > deploy/dashboard/data/data.js
          rm deploy/dashboard/data/projects.json

          find deploy -name '.DS_Store' -delete
          touch deploy/.nojekyll

      - name: Deploy to Public Repo
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: baesamaith-cmd/publicRNDSG
          publish_dir: ./deploy
          publish_branch: main
