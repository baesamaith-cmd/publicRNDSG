name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy
          cp index.html deploy/
          cp -r dashboard deploy/

          # Remove data folder entirely (data comes from Vercel API)
          rm -rf deploy/dashboard/data

          find deploy -name '.DS_Store' -delete
          touch deploy/.nojekyll

      - name: Deploy to Public Repo
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: baesamaith-cmd/publicRNDSG
          publish_dir: ./deploy
          publish_branch: main
