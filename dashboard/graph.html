<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연구 네트워크 분석 (Graph Analysis) - IGMS Dashboard</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (Built) -->
    <link href="/dashboard/css/output.css" rel="stylesheet">

    <!-- Custom CSS (Library Overrides only) -->
    <link href="/dashboard/css/style.css?v=5" rel="stylesheet">

    <!-- Libraries are imported as ES modules inside js/graph.js (sigma.js + graphology) -->
    <style>
        #viz {
            width: 100%;
            height: 800px;
            border: 1px solid #e2e8f0;
            /* ring-slate-200 */
            border-radius: 0.75rem;
            /* rounded-xl */
            background-color: #f8fafc;
            /* bg-slate-50 */
        }

        /* Node Popup Specifics */
        #nodePopup {
            display: none;
            position: fixed;
            top: 80px;
            right: 24px;
            width: 380px;
            max-height: 70vh;
            overflow-y: auto;
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.05);
            z-index: 100;
        }

        /* Config Panel Overrides handled by classes below */
    </style>
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-indigo-100 selection:text-indigo-700">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1
                    class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">
                    Research Network Analysis</h1>
                <p class="text-slate-500 mt-2 font-medium">Network Visualization • Collaboration & Topics</p>
            </div>
            <a href="index.html"
                class="flex items-center px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-lg hover:bg-slate-50 hover:text-indigo-600 transition-colors shadow-sm font-medium text-sm">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Dashboard
            </a>
        </header>

        <!-- Analysis Mode -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-8">
            <h3 class="text-sm font-bold text-slate-700 mb-4">Analysis Mode</h3>
            <div class="flex flex-wrap gap-3">
                <button onclick="drawGraph('inst-collab')"
                    class="mode-btn px-4 py-2.5 bg-indigo-50 text-indigo-700 rounded-lg hover:bg-indigo-100 font-medium text-sm transition-colors border border-indigo-100">
                    🏛 Institution Network
                </button>
                <button onclick="drawGraph('pi-topic')"
                    class="mode-btn px-4 py-2.5 bg-emerald-50 text-emerald-700 rounded-lg hover:bg-emerald-100 font-medium text-sm transition-colors border border-emerald-100">
                    🧪 Researcher-Topic
                </button>
                <button onclick="drawGraph('topic-connect')"
                    class="mode-btn px-4 py-2.5 bg-amber-50 text-amber-700 rounded-lg hover:bg-amber-100 font-medium text-sm transition-colors border border-amber-100">
                    🔗 Topic Connections
                </button>
            </div>
        </div>

        <!-- Node Detail Popup -->
        <div id="nodePopup"></div>

        <!-- Visualization -->
        <div id="viz" class="shadow-sm">
            <div
                style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;color:#94a3b8;">
                <svg class="w-16 h-16 mb-4 text-slate-300 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                <p class="text-lg font-medium">그래프 로딩 중...</p>
            </div>
        </div>

        <!-- Legend -->
        <div class="flex flex-wrap gap-4 justify-center mt-6 hidden" id="legend">
            <div
                class="flex items-center gap-2 px-3 py-1.5 bg-blue-50 text-blue-700 rounded-full text-xs font-medium border border-blue-100">
                <div class="w-2.5 h-2.5 rounded-full bg-blue-400"></div> Institution
            </div>
            <div
                class="flex items-center gap-2 px-3 py-1.5 bg-violet-50 text-violet-700 rounded-full text-xs font-medium border border-violet-100">
                <div class="w-2.5 h-2.5 rounded-full bg-violet-400"></div> Project
            </div>
            <div
                class="flex items-center gap-2 px-3 py-1.5 bg-amber-50 text-amber-700 rounded-full text-xs font-medium border border-amber-100">
                <div class="w-2.5 h-2.5 rounded-full bg-amber-400"></div> Researcher
            </div>
            <div
                class="flex items-center gap-2 px-3 py-1.5 bg-green-50 text-green-700 rounded-full text-xs font-medium border border-green-100">
                <div class="w-2.5 h-2.5 rounded-full bg-green-400"></div> Topic
            </div>
        </div>

        <!-- Graph Controls -->
        <div class="mt-6 flex justify-center gap-3">
            <button onclick="fitGraph()"
                class="px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-lg hover:bg-slate-50 text-sm font-medium shadow-sm transition-colors">
                Fit View
            </button>
            <button onclick="zoomIn()"
                class="px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-lg hover:bg-slate-50 text-sm font-medium shadow-sm transition-colors">
                Zoom +
            </button>
            <button onclick="zoomOut()"
                class="px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-lg hover:bg-slate-50 text-sm font-medium shadow-sm transition-colors">
                Zoom -
            </button>
        </div>

        <div class="mt-6 text-xs text-slate-400 text-center font-medium">
            * Click nodes for details • Scroll to zoom • Drag to pan
        </div>
    </div>

    <!-- Graph JS -->
    <script type="module" src="/dashboard/js/graph.js?v=5"></script>

</html>
