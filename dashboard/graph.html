<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연구 네트워크 분석 (Graph Analysis) - IGMS Dashboard</title>

    <!-- CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <!-- Libraries -->
    <script src="https://unpkg.com/neovis.js@2.1.0/dist/neovis.js"></script>
    <style>
        #viz {
            width: 100%;
            height: 800px;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            background-color: #f9fafb;
        }

        .config-panel {
            background: white;
            padding: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">연구 네트워크 분석</h1>
                <p class="text-gray-600 mt-2">Neo4j 기반 연구자 및 기관 연결망 시각화</p>
            </div>
            <a href="index.html"
                class="bg-white text-blue-600 px-4 py-2 rounded-lg border border-blue-200 hover:bg-blue-50 transition-colors">
                ← 대시보드로 돌아가기
            </a>
        </header>

        <!-- Configuration Panel -->
        <div class="config-panel">
            <h2 class="text-xl font-semibold mb-4">네트워크 설정</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Connection Details -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Neo4j URI</label>
                    <input type="text" id="neo_uri" class="w-full px-3 py-2 border rounded-md"
                        placeholder="bolt://localhost:7687" value="neo4j+s://b1d80b38.databases.neo4j.io">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="neo_user" class="w-full px-3 py-2 border rounded-md" value="neo4j">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="neo_pass" class="w-full px-3 py-2 border rounded-md"
                        placeholder="********">
                </div>
            </div>

            <div class="mt-6 border-t pt-4">
                <h3 class="text-lg font-medium mb-3">분석 모드</h3>
                <div class="flex flex-wrap gap-4">
                    <button onclick="drawGraph('inst-collab', event)"
                        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">기관 협력망</button>
                    <button onclick="drawGraph('pi-topic', event)"
                        class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">연구자-주제 네트워크</button>
                    <button onclick="drawGraph('custom', event)"
                        class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700">Custom Cypher</button>
                </div>
                <div id="cypher-container" class="mt-3 hidden">
                    <textarea id="cypher" rows="3" class="w-full p-2 border rounded font-mono text-sm"
                        placeholder="MATCH (n)-[r]->(m) RETURN n,r,m LIMIT 25"></textarea>
                </div>
            </div>

            <div class="mt-4 flex justify-end">
                <button id="connectBtn" onclick="drawGraph('current', event)"
                    class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 font-bold">
                    네트워크 불러오기
                </button>
            </div>
        </div>

        <!-- Visualization -->
        <div id="viz">
            <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;color:#666;">
                <p style="font-size:1.2rem;">Neo4j 연결 정보를 입력하고 "네트워크 불러오기" 버튼을 클릭하세요.</p>
                <p style="margin-top:10px;font-size:0.9rem;color:#999;">
                    ※ 먼저 <code>python migrate_to_neo4j.py</code> 실행하여 데이터를 Neo4j에 마이그레이션해야 합니다.
                </p>
            </div>
        </div>

        <div class="mt-4 text-sm text-gray-500 text-center">
            * 노드를 더블 클릭하면 연결된 이웃을 확장할 수 있습니다.
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/graph.js"></script>
</body>

</html>
